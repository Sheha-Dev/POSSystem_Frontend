<div class="items-layout">
  <section class="items-main" aria-label="Purchase bill items">
    <app-item-entry-form (lineAdded)="addLine($event)" />
    <app-items-table [lines]="lines()" />
    <div class="submit-row">
      <span class="submit-hint">{{ lines().length }} {{ lines().length === 1 ? 'item' : 'items' }} ready to save</span>
      <button class="btn btn-primary submit-button" type="button" [disabled]="lines().length === 0 || isSubmitting()" (click)="submitPurchase()">
        @if (isSubmitting()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          Saving purchase order…
        } @else {
          Submit purchase order
        }
      </button>
    </div>
  </section>
  <app-purchase-summary [lines]="lines()" />
</div>
